apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sentinel-bot
  namespace: apps
spec:
  interval: 5m
  chart:
    spec:
      chart: ./helm/sentinel-bot
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      interval: 5m
  values:
    image:
      repository: ghcr.io/mexxo-dvp/sentinel-bot
      tag: main
      pullPolicy: IfNotPresent
      arch: ""
    imagePullSecrets:
      - name: ghcr-cred
    teleToken:
      secretName: sentinel-bot
      secretKey: token

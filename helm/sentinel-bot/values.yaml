repository: "ghcr.io/mexxo-dvp/sentinel-bot"
tag: "develop"

TELE_TOKEN: ""   # не використовуємо; секрет з GitOps

replicaCount: 1

image:
  repository: "ghcr.io/mexxo-dvp/sentinel-bot"
  tag: "develop"
  pullPolicy: IfNotPresent
  os: linux
  arch: amd64

imagePullSecrets:
  - name: ghcr-cred

service:
  enabled: false
  type: ClusterIP
  port: 8080

ingress:
  enabled: false

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}

teleToken:
  secretName: sentinel-bot
  secretKey: token

args:
  - sentinel-bot
  - --http-addr=:8080

probes:
  enabled: false

env:
  - name: APP_ENV
    value: "dev"
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "otel-collector-collector.observability.svc:4317"

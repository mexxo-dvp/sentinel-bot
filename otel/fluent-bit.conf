[SERVICE]
    Parsers_File    /fluent-bit/etc/parsers.conf
    Log_Level       info

[INPUT]
    Name              tail
    Path              /var/log/containers/*.log
    Tag               kube.*
    Refresh_Interval  5
    Skip_Long_Lines   On
    DB                /tmp/flb_kube.db
    DB.Sync           Normal
    Mem_Buf_Limit     20MB
    Parser            docker

[FILTER]
    Name                kubernetes
    Match               kube.*
    Kube_Tag_Prefix     kube.var.log.containers.
    Kube_Meta_Cache_TTL 300s
    Annotations         Off

# If the application logs JSON, let's parse it
[FILTER]
    Name   parser
    Match  kube.*
    Key_Name log
    Parser  json

# We send to OTel collector по OTLP/HTTP (further collector -> Loki)
[OUTPUT]
    Name  http
    Match kube.*
    Host  otel-collector
    Port  4318
    URI   /v1/logs
    Format opentelemetry
    compress gzip

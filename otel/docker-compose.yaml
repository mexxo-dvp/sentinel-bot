version: "3.9"

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.78.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP/gRPC
      - "3030:3030"   # OTLP/HTTP (3030 optional)
      - "8889:8889"   # Prometheus scrape
    depends_on: [loki]

  prometheus:
    image: prom/prometheus:v2.52.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --enable-feature=exemplar-storage
      - --web.enable-remote-write-receiver   # !
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on: [otel-collector]

  loki:
    image: grafana/loki:2.9.4
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml:ro
    ports:
      - "3100:3100"

  grafana:
    image: grafana/grafana:10.4.3
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # disable usage telemetry (mirrored to Helm)
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./provisioning:/etc/grafana/provisioning
    ports:
      - "3002:3000"
    depends_on: [prometheus, loki]

  fluentbit:
    image: fluent/fluent-bit:2.2
    volumes:
      - /var/log:/var/log:ro
      - ./fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - ./script.lua:/fluent-bit/etc/script.lua:ro   # for Lua filter
    depends_on: [otel-collector]

  sentinel-bot:
    image: ghcr.io/mexxo-dvp/sentinel-bot:develop
    environment:
      TELE_TOKEN: "${TELE_TOKEN}"
      APP_ENV: dev
      OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector:4317"
    depends_on: [otel-collector]
